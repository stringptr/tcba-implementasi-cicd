name: CD - Ingest to Azure Data Lake

# Continuous deployment: the scraping pipeline runs on a 6-hourly schedule and
# can be triggered manually from the Actions tab (Run workflow).
on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, on the hour (UTC).
    - cron: "0 */6 * * *"

# Federated credentials (OIDC) need an id token; no client secret is stored.
permissions:
  id-token: write
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraping pipeline
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: python -m ingest.pipeline
